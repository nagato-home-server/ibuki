name: VPP namespace smoke

on:
  push:
    paths:
      - '.github/workflows/vpp-namespace-smoke.yml'
      - 'scripts/vm-gre-namespace-v2-smoke.sh'
      - 'scripts/vm-vpp-ns-*.sh'
      - 'scripts/vm-netns-ipsec-gre-*.sh'
      - 'samples/gre-namespace-v2.yaml'
      - 'samples/gre-namespace-v2-vpp-native.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [strongswan, vpp-native]
    steps:
      - uses: actions/checkout@v5
      - name: Install namespace and strongSwan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping strongswan-swanctl strongswan-charon curl ca-certificates gnupg
      - name: Install FD.io VPP packages
        run: sudo env DRY_RUN=0 sh scripts/vm-install-vpp-fdio.sh
      - name: Install VPP crypto engines for native IPsec
        if: matrix.backend == 'vpp-native'
        run: sudo apt-get install -y vpp-crypto-engines
      - name: Build Ibuki on the runner
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-ci --parallel 4 --target eventnet_netns_plan eventnet_yaml_demo
      - name: Test strongSwan GRE namespace runtime
        if: matrix.backend == 'strongswan'
        run: timeout 12m sudo env SKIP_BUILD=1 BUILD_DIR="$PWD/build-ci" sh scripts/vm-gre-namespace-v2-smoke.sh samples/gre-namespace-v2.yaml
      - name: Reapply strongSwan GRE namespace runtime after cleanup
        if: matrix.backend == 'strongswan'
        run: timeout 12m sudo env SKIP_BUILD=1 BUILD_DIR="$PWD/build-ci" sh scripts/vm-gre-namespace-v2-smoke.sh samples/gre-namespace-v2.yaml
      - name: Test VPP native IPsec namespace runtime
        if: matrix.backend == 'vpp-native'
        run: timeout 12m sudo env SKIP_BUILD=1 BUILD_DIR="$PWD/build-ci" sh scripts/vm-gre-namespace-v2-smoke.sh samples/gre-namespace-v2-vpp-native.yaml
      - name: Reapply VPP native IPsec namespace runtime after cleanup
        if: matrix.backend == 'vpp-native'
        run: timeout 12m sudo env SKIP_BUILD=1 BUILD_DIR="$PWD/build-ci" sh scripts/vm-gre-namespace-v2-smoke.sh samples/gre-namespace-v2-vpp-native.yaml
      - name: Verify no namespace runtime residue
        run: |
          for ns in site-a site-b; do
            for path in "/run/ibuki-vpp-ns/$ns/cli.sock" "/run/ibuki-vpp-ns/$ns/api.sock" "/run/ibuki-vpp-ns/$ns/vpp.pid" "/run/eventnet-netns-ipsec-gre-v2/$ns/charon.pid"; do
              if sudo test -e "$path"; then echo "Residual runtime file: $path"; exit 1; fi
            done
            if sudo ip netns exec "$ns" ip link show ib-lan-src >/dev/null 2>&1; then echo "Residual LAN interface in $ns"; exit 1; fi
            if [ -n "$(sudo ip netns exec "$ns" ip xfrm state)" ]; then echo "Residual XFRM state in $ns"; exit 1; fi
            if [ -n "$(sudo ip netns exec "$ns" ip xfrm policy)" ]; then echo "Residual XFRM policy in $ns"; exit 1; fi
          done
      - name: Show daemon logs after failure
        if: failure()
        run: |
          for path in /run/ibuki-vpp-ns/site-*/vpp.log /run/eventnet-netns-ipsec-gre-v2/site-*/charon.log; do
            if [ -f "$path" ]; then
              echo "== $path =="
              sudo tail -n 100 "$path"
            fi
          done
