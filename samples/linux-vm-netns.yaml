tunnels:
  - id: tun-a-hub
    local_node: site-a
    remote_node: hub-1
    local_endpoint: 203.0.113.14
    remote_endpoint: 203.0.113.13
    local_id: site-a
    remote_id: hub-1
    psk: "change-me"
    local_ts: 10.10.1.0/24
    remote_ts: 10.10.254.0/24

  - id: tun-hub-b
    local_node: hub-1
    remote_node: site-b
    local_endpoint: 203.0.113.17
    remote_endpoint: 203.0.113.18
    local_id: hub-1
    remote_id: site-b
    psk: "change-me"
    local_ts: 10.10.254.0/24
    remote_ts: 10.10.2.0/24

  - id: tun-a-b
    local_node: site-a
    remote_node: site-b
    local_endpoint: 203.0.113.10
    remote_endpoint: 203.0.113.9
    local_id: site-a
    remote_id: site-b
    psk: "change-me"
    local_ts: 10.10.1.0/24
    remote_ts: 10.10.2.0/24

  - id: tun-a-relay-c
    local_node: site-a
    remote_node: relay-c
    local_endpoint: 203.0.113.22
    remote_endpoint: 203.0.113.21
    local_id: site-a
    remote_id: relay-c
    psk: "change-me"
    local_ts: 10.10.1.0/24
    remote_ts: 10.10.253.0/24

  - id: tun-relay-c-b
    local_node: relay-c
    remote_node: site-b
    local_endpoint: 203.0.113.25
    remote_endpoint: 203.0.113.26
    local_id: relay-c
    remote_id: site-b
    psk: "change-me"
    local_ts: 10.10.253.0/24
    remote_ts: 10.10.2.0/24

vpp_edges:
  - node_id: site-a
    port_id: lan
    host_interface: vpp-site-a
    vpp_interface: host-ib-lan-a
    namespace_interface: vpp-client
    namespace_address: 172.16.1.2/30
    vpp_address: 172.16.1.1/30
    next_hop: 172.16.1.2
    vpp_socket: /run/ibuki-vpp-ns/site-a/cli.sock
  - node_id: site-a
    port_id: ipsec
    vpp_interface: tap0
    next_hop: 169.254.100.2
    vpp_socket: /run/ibuki-vpp-ns/site-a/cli.sock

  - node_id: site-b
    port_id: lan
    host_interface: vpp-site-b
    vpp_interface: host-ib-lan-b
    namespace_interface: vpp-client
    namespace_address: 172.16.2.2/30
    vpp_address: 172.16.2.1/30
    next_hop: 172.16.2.2
    vpp_socket: /run/ibuki-vpp-ns/site-b/cli.sock
  - node_id: site-b
    port_id: ipsec
    vpp_interface: tap0
    next_hop: 169.254.100.2
    vpp_socket: /run/ibuki-vpp-ns/site-b/cli.sock
  - node_id: hub-1
    port_id: site-a
    vpp_interface: host-ib-ha
    next_hop: 172.17.1.1
    vpp_socket: /run/ibuki-vpp-ns/hub-1/cli.sock
  - node_id: hub-1
    port_id: site-b
    vpp_interface: host-ib-hb
    next_hop: 172.17.2.2
    vpp_socket: /run/ibuki-vpp-ns/hub-1/cli.sock

paths:
  - id: path-via-hub
    source: site-a
    destination: site-b
    route_destination_prefix: 10.10.2.0/24
    route_next_hop: 203.0.113.13
    egress_tunnel_id: tun-a-hub
    waypoints:
      - hub-1
    priority: 30
    segments:
      - id: seg-a-hub
        from: site-a
        to: hub-1
        tunnel_id: tun-a-hub
      - id: seg-hub-b
        from: hub-1
        to: site-b
        tunnel_id: tun-hub-b
    routes:
      - id: route-hub-site-a
        node_id: site-a
        destination_prefix: 10.10.2.0/24
        next_hop: 169.254.100.2
        interface: tap0
      - id: route-hub-site-b
        node_id: site-b
        destination_prefix: 10.10.1.0/24
        next_hop: 169.254.100.2
        interface: tap0

  - id: path-direct
    source: site-a
    destination: site-b
    route_destination_prefix: 10.10.2.0/24
    route_next_hop: 203.0.113.9
    egress_tunnel_id: tun-a-b
    priority: 10
    segments:
      - id: seg-a-b
        from: site-a
        to: site-b
        tunnel_id: tun-a-b
    routes:
      - id: route-direct-site-a
        node_id: site-a
        destination_prefix: 10.10.2.0/24
        next_hop: 169.254.100.2
        interface: tap0
      - id: route-direct-site-b
        node_id: site-b
        destination_prefix: 10.10.1.0/24
        next_hop: 169.254.100.2
        interface: tap0

  - id: path-via-relay-c
    source: site-a
    destination: site-b
    route_destination_prefix: 10.10.2.0/24
    route_next_hop: 203.0.113.21
    egress_tunnel_id: tun-a-relay-c
    waypoints:
      - relay-c
    priority: 20
    segments:
      - id: seg-a-relay-c
        from: site-a
        to: relay-c
        tunnel_id: tun-a-relay-c
      - id: seg-relay-c-b
        from: relay-c
        to: site-b
        tunnel_id: tun-relay-c-b

intents:
  - id: intent-a-b
    traffic:
      source: site-a
      destination: site-b
    path_selection:
      mode: priority
      candidates:
        - path-direct
        - path-via-relay-c
        - path-via-hub
    transition:
      strategy: graceful
      max_pause_ms: 10
      drain_timeout_ms: 10
    fallback:
      enabled: true
      path_id: path-via-hub
