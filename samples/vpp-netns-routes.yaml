tunnels:
  - id: tun-a-b
    local_node: site-a
    remote_node: site-b
    local_endpoint: 203.0.113.10
    remote_endpoint: 203.0.113.9
    local_id: site-a
    remote_id: site-b
    psk: "change-me"
    local_ts: 10.10.1.0/24
    remote_ts: 10.10.2.0/24

vpp_edges:
  - node_id: site-a
    host_interface: vpp-site-a
    vpp_interface: host-vpp-site-a
    namespace_interface: vpp-client
    namespace_address: 172.16.1.2/30
    vpp_address: 172.16.1.1/30
    next_hop: 172.16.1.2

  - node_id: site-b
    host_interface: vpp-site-b
    vpp_interface: host-vpp-site-b
    namespace_interface: vpp-client
    namespace_address: 172.16.2.2/30
    vpp_address: 172.16.2.1/30
    next_hop: 172.16.2.2

paths:
  - id: path-vpp-explicit-bidirectional
    source: site-a
    destination: site-b
    egress_tunnel_id: tun-a-b
    priority: 10
    routes:
      - id: site-a-to-site-b-lan
        node_id: site-a
        destination_prefix: 10.10.2.0/24
        next_hop: 203.0.113.9
        table: 100
      - id: site-b-to-site-a-lan
        node_id: site-b
        destination_prefix: 10.10.1.0/24
        next_hop: 203.0.113.10
        table: 100
    segments:
      - id: seg-a-b
        from: site-a
        to: site-b
        tunnel_id: tun-a-b

intents:
  - id: intent-vpp-explicit-bidirectional
    traffic:
      source: site-a
      destination: site-b
    path_selection:
      mode: explicit
      path_id: path-vpp-explicit-bidirectional
    transition:
      strategy: immediate

  - id: intent-vpp-vlan
    traffic:
      source: site-a
      destination: site-b
      vlan_id: 100
    path_selection:
      mode: explicit
      path_id: path-vpp-explicit-bidirectional
    transition:
      strategy: immediate
